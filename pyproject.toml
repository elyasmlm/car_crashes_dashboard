[tool.ruff]
line-length = 100
target-version = "py311"

# Dossiers à analyser
src = ["src"]

# Règles activées
select = [
  "E",
  "F",
  "I",
  "B",
]

# Règlzs ignorées (pragmatique)
ignore = [
  "E501",  # on ignore les lignes trop longues
]

# Exclusions
exclude = [
  ".venv",
  "venv",
  "__pycache__",
]